<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白桃电竞 - 俱乐部下单</title>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f7f5f8;
 color:#29242d;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif
}

header{
 background:linear-gradient(135deg,#f4a9c6,#e879a7);
 color:white;
 padding:30px 22px 26px;
 border-radius:0 0 25px 25px
}

header h1{margin:0;font-size:28px}
header p{margin:9px 0 0;font-size:13px;opacity:.9}

.container{
 padding:18px;
 max-width:600px;
 margin:auto
}

.card{
 background:white;
 border-radius:17px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 3px 15px #00000008
}

.title{
 font-size:17px;
 font-weight:700;
 margin:0 0 16px
}

label{
 display:block;
 font-size:13px;
 color:#777;
 margin:13px 0 7px
}

input,select,textarea{
 width:100%;
 padding:13px;
 border:1px solid #eee;
 border-radius:10px;
 font-size:15px;
 background:#fff;
 color:#333
}

textarea{
 height:75px;
 resize:vertical
}

.services{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px
}

.service{
 border:1px solid #eee;
 border-radius:12px;
 padding:13px 5px;
 text-align:center;
 cursor:pointer
}

.service.active{
 border:2px solid #e879a7;
 background:#fff4f8;
 color:#d65389
}

.service b{
 display:block;
 font-size:15px;
 margin-bottom:5px
}

.service small{
 font-size:12px;
 color:#888
}

/* 单陪、双陪选择 */

.companions{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.companion{
 border:1px solid #eee;
 border-radius:12px;
 padding:13px 5px;
 text-align:center;
 cursor:pointer;
 background:white;
 color:#555
}

.companion.active{
 border:2px solid #e879a7;
 background:#fff4f8;
 color:#d65389
}

.companion b{
 display:block;
 font-size:15px;
 margin-bottom:5px
}

.companion small{
 font-size:12px;
 color:#888
}

button{
 border:0;
 border-radius:11px;
 padding:14px;
 font-size:15px;
 font-weight:700;
 cursor:pointer
}

button:disabled{
 opacity:.6;
 cursor:not-allowed
}

.primary{
 width:100%;
 background:#e879a7;
 color:white;
 margin-top:17px
}

.secondary{
 background:#f5e5ed;
 color:#bd527e
}

.price{
 font-size:27px;
 color:#df6396;
 font-weight:800
}

.muted{
 font-size:12px;
 color:#999;
 line-height:1.8
}

.hidden{display:none}

.order{
 border:1px solid #f0e7ec;
 border-radius:12px;
 padding:13px;
 margin:10px 0;
 overflow-wrap:anywhere
}

.order strong{font-size:14px}

.status{
 color:#d45c91;
 font-size:12px
}

.admin-actions{
 display:flex;
 gap:8px;
 margin-top:10px;
 flex-wrap:wrap
}

.admin-actions button{
 flex:1;
 min-width:65px;
 font-size:12px;
 padding:10px
}

#message,#loginMessage{
 font-size:13px;
 line-height:1.8;
 margin-top:12px
}

#systemMessage{
 background:#fff4f4;
 color:#c33;
 border-radius:10px;
 padding:12px;
 margin-bottom:15px;
 font-size:13px;
 display:none;
 line-height:1.7
}

#paymentBox{
 margin-top:18px;
 padding:15px;
 background:#fff7fa;
 border:1px solid #f5dce7;
 border-radius:13px
}

.payment-title{
 font-size:16px;
 font-weight:700;
 margin-bottom:10px
}

.payment-qr{
 display:block;
 width:220px;
 max-width:100%;
 margin:15px auto;
 border-radius:10px;
 border:1px solid #eee
}

.payment-tip{
 text-align:center;
 color:#888;
 font-size:12px;
 line-height:1.8
}

.payment-status{
 color:#d45c91;
 font-weight:700;
 margin-top:10px
}

.payment-methods{
 display:flex;
 gap:10px;
 margin-top:10px
}

.payment-methods button{
 flex:1;
 background:#f5e5ed;
 color:#bd527e
}

.payment-methods button.active{
 background:#e879a7;
 color:white
}

#paymentMessage{
 font-size:13px;
 line-height:1.8;
 margin-top:10px
}

footer{
 text-align:center;
 color:#aaa;
 font-size:11px;
 padding:20px
}
</style>
</head>

<body>

<header>
<h1>🍑 白桃电竞</h1>
<p>认真对待每一份信任 · 稳定 · 真诚 · 高性价比</p>
</header>

<div class="container">

<div id="systemMessage"></div>

<div class="card">

<h3 class="title">🎮 预约下单</h3>

<label>老板怎么称呼？</label>
<input id="nickname" placeholder="请输入您的称呼">

<label>游戏 ID</label>
<input id="gameid" placeholder="请输入您的三角洲游戏 ID">

<label>选择服务</label>

<div class="services">

<div class="service active" onclick="chooseService('娱乐陪玩',this)">
<b>娱乐陪玩</b>
<small>33元 / 小时起</small>
</div>

<div class="service" onclick="chooseService('技术陪玩',this)">
<b>技术陪玩</b>
<small>44元 / 小时起</small>
</div>

<div class="service" onclick="chooseService('护航服务',this)">
<b>护航服务</b>
<small>99元 / 单</small>
</div>

</div>

<div id="companionSection">

<label>选择陪玩人数</label>

<div class="companions">

<div class="companion active" onclick="chooseCompanionCount(1,this)">
<b>单陪</b>
<small>1位陪玩师</small>
</div>

<div class="companion" onclick="chooseCompanionCount(2,this)">
<b>双陪</b>
<small>2位陪玩师</small>
</div>

</div>

</div>

<label id="quantityLabel">预约时长</label>

<select id="quantity">
<option value="1">1小时</option>
<option value="2">2小时</option>
<option value="3">3小时</option>
<option value="4">4小时</option>
<option value="5">5小时</option>
</select>

<label>预约时间</label>

<select id="timing">
<option>尽快安排</option>
<option>今天晚上</option>
<option>明天</option>
<option>与客服协商</option>
</select>

<label>备注（选填）</label>

<textarea id="note" placeholder="有什么特殊要求可以写在这里"></textarea>

<label>订单金额</label>

<div class="price" id="price">¥33</div>

<button id="submitButton" class="primary" type="button">
提交订单
</button>

<div id="message"></div>

<div id="paymentBox" class="hidden">

<div class="payment-title">💳 订单支付</div>

<div id="paymentOrderInfo" class="muted"></div>

<label>选择支付方式</label>

<div class="payment-methods">
<button id="wechatButton" type="button">微信支付</button>
<button id="alipayButton" type="button">支付宝</button>
</div>

<img id="paymentQR" class="payment-qr hidden" alt="收款二维码">

<div id="paymentTip" class="payment-tip">
请选择支付方式查看收款二维码。
</div>

<button id="paidButton" class="primary" type="button" disabled>
我已付款
</button>

<div id="paymentMessage"></div>
<div id="paymentStatus" class="payment-status"></div>

</div>

</div>

<div class="card">

<h3 class="title">📌 下单须知</h3>

<p class="muted">
1. 提交订单后，请按照页面提示完成付款。<br>
2. 付款后请点击「我已付款」，等待客服核实。<br>
3. 具体安排以客服确认为准。<br>
4. 如有特殊要求，请提前在备注中说明。
</p>

</div>

<div class="card">

<h3 class="title">🔐 管理员入口</h3>

<div id="loginBox">

<label>管理员邮箱</label>
<input id="email" type="email" placeholder="管理员邮箱">

<label>登录密码</label>
<input id="password" type="password" placeholder="管理员密码">

<button id="adminLoginButton" class="primary" type="button">
管理员登录
</button>

<div id="loginMessage"></div>

</div>

<div id="adminBox" class="hidden">

<p>
<b>管理员后台</b>
<button class="secondary" type="button" id="logoutButton">退出登录</button>
</p>

<button class="secondary" type="button" id="refreshOrdersButton">
刷新订单
</button>

<div id="orders">正在加载订单...</div>

</div>

</div>

</div>

<footer>白桃电竞俱乐部 · 感谢每一位老板的信任</footer>

<script>

/* 1. Supabase 配置 */

const SUPABASE_URL =
'https://cdjospnktexteqyqvgzb.supabase.co';

const SUPABASE_KEY =
'sb_publishable_pLVz9K1xFEuiUGOkWmr1pw_dg-tU5N8';

const WECHAT_QR =
'https://raw.githubusercontent.com/xbl85431-cell/baitao-esports/main/IMG_4063.jpeg';

const ALIPAY_QR =
'https://raw.githubusercontent.com/xbl85431-cell/baitao-esports/main/IMG_4064.jpeg';

let db = null;
let selectedService = '娱乐陪玩';
let selectedCompanionCount = 1;
let currentUser = null;
let currentOrderNo = null;
let currentPaymentMethod = null;
let currentOrderAmount = 0;
let paymentQrReady = false;

/* 2. 数据库连接：开启持久化登录 */

function getDB(){

 if(db) return db;

 if(!window.supabase || !window.supabase.createClient){
  throw new Error('管理员数据库组件加载失败，请刷新网页。');
 }

 db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
   }
  }
 );

 return db;
}

/* 3. 通用中转接口 */

async function callNetlifyFunction(path,body){

 const response = await fetch(
  '/.netlify/functions/' + path,
  {
   method:'POST',
   headers:{
    'Content-Type':'application/json'
   },
   body:JSON.stringify(body)
  }
 );

 const text = await response.text();

 let result;

 try{
  result = JSON.parse(text);
 }catch{
  throw new Error('服务器返回内容无法识别：'+text.slice(0,200));
 }

 if(!response.ok || !result.success){
  throw new Error(
   result.message || '服务器请求失败，状态码：'+response.status
  );
 }

 return result.data;
}

/* 4. 选择服务 */

function chooseService(service,el){

 selectedService = service;

 document.querySelectorAll('.service').forEach(function(item){
  item.classList.remove('active');
 });

 el.classList.add('active');

 const quantity = document.getElementById('quantity');
 const label = document.getElementById('quantityLabel');
 const companionSection = document.getElementById('companionSection');

 // 切换服务时默认恢复单陪
 selectedCompanionCount = 1;

 document.querySelectorAll('.companion').forEach(function(item){
  item.classList.remove('active');
 });

 document.querySelectorAll('.companion')[0].classList.add('active');

 if(service === '护航服务'){

  companionSection.classList.add('hidden');

  quantity.innerHTML = '<option value="1">1单</option>';
  label.innerText = '护航数量';

 }else{

  companionSection.classList.remove('hidden');

  quantity.innerHTML = '';

  for(let i=1;i<=5;i++){
   quantity.innerHTML += '<option value="'+i+'">'+i+'小时</option>';
  }

  label.innerText = '预约时长';
 }

 quantity.value = '1';

 calculate();
}

/* 5. 选择陪玩人数 */

function chooseCompanionCount(count,el){

 if(selectedService === '护航服务'){
  return;
 }

 if(count !== 1 && count !== 2){
  return;
 }

 selectedCompanionCount = count;

 document.querySelectorAll('.companion').forEach(function(item){
  item.classList.remove('active');
 });

 el.classList.add('active');

 calculate();
}

/* 6. 计算金额 */

function calculate(){

 const quantityElement = document.getElementById('quantity');
 const priceElement = document.getElementById('price');

 if(!quantityElement || !priceElement) return 0;

 const quantity = Number(quantityElement.value) || 1;

 let unit = 33;

 if(selectedService === '技术陪玩') unit = 44;
 if(selectedService === '护航服务') unit = 99;

 const people = selectedService === '护航服务'
  ? 1
  : selectedCompanionCount;

 const total = unit * quantity * people;

 priceElement.innerText = '¥' + total;

 return total;
}

/* 7. 提交订单 */

async function submitOrder(){

 const nickname = document.getElementById('nickname').value.trim();
 const gameid = document.getElementById('gameid').value.trim();
 const quantity = Number(document.getElementById('quantity').value);
 const timing = document.getElementById('timing').value;
 const note = document.getElementById('note').value.trim();

 const companionCount = selectedService === '护航服务'
  ? 1
  : selectedCompanionCount;

 const message = document.getElementById('message');
 const button = document.getElementById('submitButton');

 if(!nickname || !gameid){
  message.style.color = 'red';
  message.innerText = '请填写称呼和游戏 ID。';
  return;
 }

 if(!Number.isInteger(quantity) || quantity < 1 || quantity > 5){
  message.style.color = 'red';
  message.innerText = '预约数量不正确，请重新选择。';
  return;
 }

 if(button.disabled) return;

 button.disabled = true;
 button.innerText = '正在提交...';

 message.style.color = '#888';
 message.innerText = '正在提交订单，请稍候...';

 document.getElementById('paymentBox').classList.add('hidden');

 currentOrderNo = null;
 currentPaymentMethod = null;
 currentOrderAmount = 0;
 paymentQrReady = false;

 try{

  const result = await callNetlifyFunction(
   'create-order',
   {
    nickname:nickname,
    game_id:gameid,
    service:selectedService,
    quantity:quantity,
    companion_count:companionCount,
    timing:timing,
    note:note
   }
  );

  if(!result || !result.order_no){
   throw new Error('服务器没有返回有效订单信息。');
  }

  const amount = Number(result.amount);

  if(!Number.isFinite(amount) || amount <= 0){
   throw new Error('订单金额异常，请联系客服处理。');
  }

  currentOrderNo = result.order_no;
  currentOrderAmount = amount;
  currentPaymentMethod = null;

  const companionText = selectedService === '护航服务'
   ? '护航服务'
   : (companionCount === 2 ? '双陪（2人）' : '单陪（1人）');

  message.style.color = '#d45c91';

  message.innerHTML =
   '订单提交成功！<br>'+
   '订单编号：'+escapeHTML(result.order_no)+'<br>'+
   '服务：'+escapeHTML(result.service)+'<br>'+
   '陪玩人数：'+escapeHTML(companionText)+'<br>'+
   '金额：¥'+escapeHTML(result.amount);

  document.getElementById('paymentOrderInfo').innerHTML =
   '订单编号：'+escapeHTML(result.order_no)+'<br>'+
   '服务：'+escapeHTML(result.service)+'<br>'+
   '陪玩人数：'+escapeHTML(companionText)+'<br>'+
   '订单金额：<b style="color:#df6396;font-size:20px">¥'+
   escapeHTML(result.amount)+'</b>';

  document.getElementById('paymentBox').classList.remove('hidden');

  const qr = document.getElementById('paymentQR');

  qr.classList.add('hidden');
  qr.removeAttribute('src');

  document.getElementById('paymentTip').innerText =
   '请选择支付方式查看收款二维码。';

  document.getElementById('paymentMessage').innerText = '';
  document.getElementById('paymentStatus').innerText = '';

  document.getElementById('paidButton').disabled = true;
  document.getElementById('paidButton').innerText = '我已付款';

  document.getElementById('wechatButton').classList.remove('active');
  document.getElementById('alipayButton').classList.remove('active');

  document.getElementById('nickname').value = '';
  document.getElementById('gameid').value = '';
  document.getElementById('note').value = '';

  document.getElementById('paymentBox').scrollIntoView({
   behavior:'smooth',
   block:'center'
  });

 }catch(error){

  message.style.color = 'red';

  message.innerText =
   '提交失败：'+(error.message || '未知错误')+
   '。如果不确定是否创建成功，请先检查后台订单，不要连续重复提交。';

 }finally{

  button.disabled = false;
  button.innerText = '提交订单';

 }
}

/* 8. 选择付款方式 */

function choosePayment(method){

 if(!currentOrderNo){
  alert('请先提交订单。');
  return;
 }

 if(document.getElementById('paidButton').disabled === false){
  alert('当前订单已经提交过付款申请，请等待客服核实。');
  return;
 }

 currentPaymentMethod = method;
 paymentQrReady = false;

 const qr = document.getElementById('paymentQR');
 const tip = document.getElementById('paymentTip');
 const paidButton = document.getElementById('paidButton');

 const wechatButton = document.getElementById('wechatButton');
 const alipayButton = document.getElementById('alipayButton');

 paidButton.disabled = true;

 qr.classList.add('hidden');

 wechatButton.classList.remove('active');
 alipayButton.classList.remove('active');

 tip.innerText = '正在加载收款二维码...';

 if(method === '微信支付'){
  wechatButton.classList.add('active');
 }else{
  alipayButton.classList.add('active');
 }

 qr.onload = function(){

  paymentQrReady = true;
  qr.classList.remove('hidden');
  paidButton.disabled = false;

  tip.innerText =
   '请使用'+method+'扫码支付，支付金额：¥'+currentOrderAmount+'。';

 };

 qr.onerror = function(){

  paymentQrReady = false;
  qr.classList.add('hidden');
  paidButton.disabled = true;

  tip.innerText = '
