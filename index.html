<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f7f5f8;
 color:#29242d;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif
}

header{

header h1{margin:0;font-size:28px}
header p{margin:9px 0 0;font-size:13px;opacity:.9}

.container{
 padding:18px;
 max-width:600px;

}

.card{
 background:white;

 margin-bottom:15px;
 box-shadow:0 3px 15px #00000008
}

.title{

 font-weight:700;
 margin:0 0 16px
}

label{

 font-size:13px;
 color:#777;
 margin:13px 0 7px
}

input,select,textarea{

 padding:13px;
 border:1px solid #eee;
 border-radius:10px;
 font-size:15px;

 color:#333
}

textarea{

}

.services{

.service{

}

.service.active{

}

.service b{

 margin-bottom:5px

.service small{
 font-size:12px;

}

button{
 border:0;
 border-radius:11px;
 padding:14px;
 font-size:15px;
 font-weight:700;
 cursor:pointer
}

button:disabled{
 opacity:.6;
 cursor:not-allowed
}

.primary{
 width:100%;
 background:#e879a7;
 color:white;
 margin-top:17px
}

.secondary{
 background:#f5e5ed;
 color:#bd527e
}

.price{
 font-size:27px;
 color:#df6396;
 font-weight:800
}

.muted{
 font-size:12px;
 color:#999;
 line-height:1.8
}

.hidden{display:none}

.order{
 border:1px solid #f0e7ec;
 border-radius:12px;
 padding:13px;
 margin:10px 0;
 overflow-wrap:anywhere
}

.order strong{font-size:14px}

.status{
 color:#d45c91;
 font-size:12px
}

.admin-actions{
 display:flex;
 gap:8px;
 margin-top:10px;
 flex-wrap:wrap
}

.admin-actions button{
 flex:1;
 min-width:65px;
 font-size:12px;
 padding:10px
}

#message,#loginMessage{
 font-size:13px;
 line-height:1.8;
 margin-top:12px
}

#systemMessage{
 background:#fff4f4;
 color:#c33;
 border-radius:10px;
 padding:12px;
 margin-bottom:15px;
 font-size:13px;
 display:none;
 line-height:1.7
}

#paymentBox{
 margin-top:18px;
 padding:15px;
 background:#fff7fa;
 border:1px solid #f5dce7;
 border-radius:13px
}

.payment-title{
 font-size:16px;
 font-weight:700;
 margin-bottom:10px
}

.payment-qr{
 display:block;
 width:220px;
 max-width:100%;
 margin:15px auto;
 border-radius:10px;
 border:1px solid #eee
}

.payment-tip{
 text-align:center;
 color:#888;
 font-size:12px;
 line-height:1.8
}

.payment-status{
 color:#d45c91;
 font-weight:700;
 margin-top:10px
}

.payment-methods{
 display:flex;
 gap:10px;
 margin-top:10px
}

.payment-methods button{
 flex:1;
 background:#f5e5ed;
 color:#bd527e
}

.payment-methods button.active{
 background:#e879a7;
 color:white
}

#paymentMessage{
 font-size:13px;
 line-height:1.8;
 margin-top:10px
}

footer{
 text-align:center;
 color:#aaa;
 font-size:11px;
 padding:20px
}
</style>
</head>

<body>

<header>
<h1>🍑 白桃电竞</h1>
<p>认真对待每一份信任 · 稳定 · 真诚 · 高性价比</p>
</header>

<div class="container">

<div id="systemMessage"></div>

<div class="card">

<h3 class="title">🎮 预约下单</h3>

<label>老板怎么称呼？</label>

<label>选择服务</label>

<h3 class="title">📌 下单须知</h3>

1. 提交订单后，请按照页面提示完成付款。<br>
2. 付款后请点击「我已付款」，等待客服核实。<br>

<div class="card">

<div id="loginBox">

<label>管理员邮箱</label>
<input id="email" type="email" placeholder="管理员邮箱">

<input id="password" type="password" placeholder="管理员密码">

<button id="adminLoginButton" class="primary" type="button">
管理员登录
</button>

<div id="loginMessage"></div>

</div>

<div id="adminBox" class="hidden">

<p>
<b>管理员后台</b>
<button class="secondary" type="button" id="logoutButton">退出登录</button>
</p>

刷新订单
</button>

</div>

<script>

/* 1. Supabase 配置 */

const SUPABASE_URL =
'https://cdjospnktexteqyqvgzb.supabase.co';

const SUPABASE_KEY =
'sb_publishable_pLVz9K1xFEuiUGOkWmr1pw_dg-tU5N8';

const WECHAT_QR =
'https://raw.githubusercontent.com/xbl85431-cell/baitao-esports/main/IMG_4063.jpeg';

const ALIPAY_QR =
'https://raw.githubusercontent.com/xbl85431-cell/baitao-esports/main/IMG_4064.jpeg';

let db = null;
let selectedService = '娱乐陪玩';
let currentUser = null;
let currentOrderNo = null;
let currentPaymentMethod = null;
let currentOrderAmount = 0;
let paymentQrReady = false;

/* 2. 数据库连接：仅管理员功能使用 */

function getDB(){

 if(db) return db;

 if(!window.supabase || !window.supabase.createClient){
  throw new Error('管理员数据库组件加载失败，请刷新网页。');
 }

 db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );

 return db;
}

/* 3. 通用中转接口 */

async function callNetlifyFunction(path,body){

 const response = await fetch(
  '/.netlify/functions/' + path,
  {
   method:'POST',
   headers:{
    'Content-Type':'application/json'
   },
   body:JSON.stringify(body)
  }
 );

 const text = await response.text();

 let result;

 try{
  result = JSON.parse(text);
 }catch{
  throw new Error('服务器返回内容无法识别：'+text.slice(0,200));
 }

 if(!response.ok || !result.success){
  throw new Error(
   result.message || '服务器请求失败，状态码：'+response.status
  );
 }

 return result.data;
}

/* 4. 选择服务 */

function chooseService(service,el){

 selectedService = service;

 document.querySelectorAll('.service').forEach(function(item){
  item.classList.remove('active');
 });

 el.classList.add('active');

 const quantity = document.getElementById('quantity');
 const label = document.getElementById('quantityLabel');

 if(service === '护航服务'){

  quantity.innerHTML = '<option value="1">1单</option>';
  label.innerText = '护航数量';

 }else{

  quantity.innerHTML = '';

  for(let i=1;i<=5;i++){
   quantity.innerHTML += '<option value="'+i+'">'+i+'小时</option>';
  }

  label.innerText = '预约时长';
 }

 quantity.value = '1';

 calculate();
}

/* 5. 计算金额 */

function calculate(){

 const quantityElement = document.getElementById('quantity');
 const priceElement = document.getElementById('price');

 if(!quantityElement || !priceElement) return 0;

 const quantity = Number(quantityElement.value) || 1;

 let unit = 33;

 if(selectedService === '技术陪玩') unit = 44;
 if(selectedService === '护航服务') unit = 99;

 const total = unit * quantity;

 priceElement.innerText = '¥' + total;

 return total;
}

/* 6. 提交订单：改为 Netlify 中转 */

async function submitOrder(){

 const nickname = document.getElementById('nickname').value.trim();
 const gameid = document.getElementById('gameid').value.trim();
 const quantity = Number(document.getElementById('quantity').value);
 const timing = document.getElementById('timing').value;
 const note = document.getElementById('note').value.trim();

 const message = document.getElementById('message');
 const button = document.getElementById('submitButton');

 if(!nickname || !gameid){
  message.style.color = 'red';
  message.innerText = '请填写称呼和游戏 ID。';
  return;
 }

 if(!Number.isInteger(quantity) || quantity < 1 || quantity > 5){
  message.style.color = 'red';
  message.innerText = '预约数量不正确，请重新选择。';
  return;
 }

 if(button.disabled) return;

 button.disabled = true;
 button.innerText = '正在提交...';

 message.style.color = '#888';
 message.innerText = '正在提交订单，请稍候...';

 document.getElementById('paymentBox').classList.add('hidden');

 currentOrderNo = null;
 currentPaymentMethod = null;
 currentOrderAmount = 0;
 paymentQrReady = false;

 try{

  const result = await callNetlifyFunction(
   'create-order',
   {
    nickname:nickname,
    game_id:gameid,
    service:selectedService,
    quantity:quantity,
    timing:timing,
    note:note
   }
  );

  if(!result || !result.order_no){
   throw new Error('服务器没有返回有效订单信息。');
  }

  const amount = Number(result.amount);

  if(!Number.isFinite(amount) || amount <= 0){
   throw new Error('订单金额异常，请联系客服处理。');
  }

  currentOrderNo = result.order_no;
  currentOrderAmount = amount;
  currentPaymentMethod = null;

  message.style.color = '#d45c91';

  message.innerHTML =
   '订单提交成功！<br>'+
   '订单编号：'+escapeHTML(result.order_no)+'<br>'+
   '服务：'+escapeHTML(result.service)+'<br>'+
   '金额：¥'+escapeHTML(result.amount);

  document.getElementById('paymentOrderInfo').innerHTML =
   '订单编号：'+escapeHTML(result.order_no)+'<br>'+
   '订单金额：<b style="color:#df6396;font-size:20px">¥'+
   escapeHTML(result.amount)+'</b>';

  document.getElementById('paymentBox').classList.remove('hidden');

  const qr = document.getElementById('paymentQR');

  qr.classList.add('hidden');
  qr.removeAttribute('src');

  document.getElementById('paymentTip').innerText =
   '请选择支付方式查看收款二维码。';

  document.getElementById('paymentMessage').innerText = '';
  document.getElementById('paymentStatus').innerText = '';

  document.getElementById('paidButton').disabled = true;
  document.getElementById('paidButton').innerText = '我已付款';

  document.getElementById('wechatButton').classList.remove('active');
  document.getElementById('alipayButton').classList.remove('active');

  document.getElementById('nickname').value = '';
  document.getElementById('gameid').value = '';
  document.getElementById('note').value = '';

  document.getElementById('paymentBox').scrollIntoView({
   behavior:'smooth',
   block:'center'
  });

 }catch(error){

  message.style.color = 'red';

  message.innerText =
   '提交失败：'+(error.message || '未知错误')+
   '。如果不确定是否创建成功，请先检查后台订单，不要连续重复提交。';

 }finally{

  button.disabled = false;
  button.innerText = '提交订单';

 }
}

/* 7. 选择付款方式 */

function choosePayment(method){

 if(!currentOrderNo){
  alert('请先提交订单。');
  return;
 }

 if(document.getElementById('paidButton').disabled === false){
  alert('当前订单已经提交过付款申请，请等待客服核实。');
  return;
 }

 currentPaymentMethod = method;
 paymentQrReady = false;

 const qr = document.getElementById('paymentQR');
 const tip = document.getElementById('paymentTip');
 const paidButton = document.getElementById('paidButton');

 const wechatButton = document.getElementById('wechatButton');
 const alipayButton = document.getElementById('alipayButton');

 paidButton.disabled = true;

 qr.classList.add('hidden');

 wechatButton.classList.remove('active');
 alipayButton.classList.remove('active');

 tip.innerText = '正在加载收款二维码...';

 if(method === '微信支付'){
  wechatButton.classList.add('active');
 }else{
  alipayButton.classList.add('active');
 }

 qr.onload = function(){

  paymentQrReady = true;
  qr.classList.remove('hidden');
  paidButton.disabled = false;

  tip.innerText =
   '请使用'+method+'扫码支付，支付金额：¥'+currentOrderAmount+'。';

 };

 qr.onerror = function(){

  paymentQrReady = false;
  qr.classList.add('hidden');
  paidButton.disabled = true;

  tip.innerText = '二维码加载失败，请联系客服处理。';

 };

 qr.src = method === '微信支付' ? WECHAT_QR : ALIPAY_QR;

}

/* 8. 老板提交付款申请：改为 Netlify 中转 */

async function markPaid(){

 if(!currentOrderNo){
  alert('没有找到当前订单，请先提交订单。');
  return;
 }

 if(!currentPaymentMethod){
  alert('请先选择微信支付或支付宝。');
  return;
 }

 if(!paymentQrReady){
  alert('二维码尚未加载成功，请稍候再试。');
  return;
 }

 const button = document.getElementById('paidButton');
 const message = document.getElementById('paymentMessage');

 button.disabled = true;
 button.innerText = '正在提交...';

 message.style.color = '#888';
 message.innerText = '正在提交付款申请，请稍候...';

 try{

  await callNetlifyFunction(
   'mark-order-paid',
   {
    order_no:currentOrderNo,
    payment_method:currentPaymentMethod
   }
  );

  message.style.color = '#d45c91';
  message.innerText = '付款申请提交成功，请等待客服核实到账。';

  document.getElementById('paymentStatus').innerText =
   '付款状态：待核实';

  button.innerText = '已提交付款申请';
  button.disabled = true;

  if(currentUser){
   await loadOrders();
  }

 }catch(error){

  message.style.color = 'red';
  message.innerText = '提交失败：'+error.message;

  button.disabled = false;
  button.innerText = '我已付款';

 }
}

/* 9. 管理员登录 */

async function adminLogin(){

 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('password').value;

 const message = document.getElementById('loginMessage');
 const button = document.getElementById('adminLoginButton');

 if(!email || !password){
  message.style.color = 'red';
  message.innerText = '请输入管理员邮箱和密码。';
  return;
 }

 button.disabled = true;
 button.innerText = '正在登录...';

 message.style.color = '#888';
 message.innerText = '正在验证管理员账号...';

 try{

  const client = getDB();

  const {data,error} = await client.auth.signInWithPassword({
   email:email,
   password:password
  });

  if(error) throw error;

  if(!data.user){
   throw new Error('登录成功，但没有获取到用户信息。');
  }

  currentUser = data.user;

  message.innerText = '登录成功！';

  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminBox').classList.remove('hidden');

  await loadOrders();

 }catch(error){

  message.style.color = 'red';
  message.innerText = '登录失败：'+error.message;

 }finally{

  button.disabled = false;
  button.innerText = '管理员登录';

 }
}

/* 10. 管理员退出 */

async function logout(){

 try{
  const client = getDB();
  await client.auth.signOut();
 }catch(error){
  console.error(error);
 }

 currentUser = null;

 document.getElementById('adminBox').classList.add('hidden');
 document.getElementById('loginBox').classList.remove('hidden');
 document.getElementById('loginMessage').innerText = '';

}

/* 11. HTML 安全处理 */

function escapeHTML(value){

 return String(value ?? '').replace(/[&<>"']/g,function(char){

  return {
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[char];

 });

}

/* 12. 后台按钮 */

function createAdminButton(text,callback){

 const button = document.createElement('button');

 button.type = 'button';
 button.className = 'secondary';
 button.innerText = text;

 button.addEventListener('click',callback);

 return button;

}

/* 13. 后台加载订单 */

async function loadOrders(){

 const box = document.getElementById('orders');

 box.innerHTML = '正在加载订单...';

 try{

  if(!currentUser){
   throw new Error('管理员尚未登录。');
  }

  const client = getDB();

  const {data,error} = await client
   .from('orders')
   .select('*')
   .order('created_at',{ascending:false});

  if(error) throw error;

  if(!data || data.length === 0){
   box.innerHTML = '目前还没有订单。';
   return;
  }

  box.innerHTML = '';

  data.forEach(function(order){

   const item = document.createElement('div');
   item.className = 'order';

   const paymentStatus = order.payment_status || '待付款';
   const paymentMethod = order.payment_method || '尚未选择';

   const addText = function(label,value){

    const strong = document.createElement('strong');
    strong.innerText = label + '：';

    item.appendChild(strong);
    item.appendChild(document.createTextNode(String(value ?? '')));
    item.appendChild(document.createElement('br'));

   };

   addText('订单编号',order.order_no);
   addText('老板',order.nickname);
   addText('游戏 ID',order.game_id);
   addText('服务',order.service);
   addText('数量',order.quantity);
   addText('金额','¥'+order.amount);
   addText('预约时间',order.timing);
   addText('备注',order.note || '无');
   addText('付款方式',paymentMethod);

   const paymentLabel = document.createElement('strong');
   paymentLabel.innerText = '付款状态：';
   item.appendChild(paymentLabel);

   const paymentSpan = document.createElement('span');
   paymentSpan.className = 'status';
   paymentSpan.innerText = paymentStatus;

   item.appendChild(paymentSpan);
   item.appendChild(document.createElement('br'));

   addText('打手',order.worker_name || '暂未分配');

   const statusLabel = document.createElement('strong');
   statusLabel.innerText = '订单状态：';
   item.appendChild(statusLabel);

   const statusSpan = document.createElement('span');
   statusSpan.className = 'status';
   statusSpan.innerText = order.status || '未知';

   item.appendChild(statusSpan);
   item.appendChild(document.createElement('br'));

   const workerLabel = document.createElement('label');
   workerLabel.innerText = '填写打手名称';
   item.appendChild(workerLabel);

   const workerInput = document.createElement('input');
   workerInput.placeholder = '填写打手名称';
   workerInput.value = order.worker_name || '';

   item.appendChild(workerInput);

   const actions = document.createElement('div');
   actions.className = 'admin-actions';

   if(paymentStatus === '待核实'){

    actions.appendChild(
     createAdminButton('确认收款',function(){
      confirmPayment(order.id);
     })
    );

   }

   actions.appendChild(
    createAdminButton('接单',function(){
     updateOrder(order.id,'已接单');
    })
   );

   actions.appendChild(
    createAdminButton('分配打手',function(){
     assignWorker(order.id,workerInput.value);
    })
   );

   actions.appendChild(
    createAdminButton('完成',function(){
     updateOrder(order.id,'已完成');
    })
   );

   item.appendChild(actions);
   box.appendChild(item);

  });

 }catch(error){

  box.innerHTML =
   '<span style="color:red">订单加载失败：'+
   escapeHTML(error.message)+'</span>';

 }

}

/* 14. 管理员确认收款 */

async function confirmPayment(id){

 if(!currentUser){
  alert('请先登录管理员账号。');
  return;
 }

 const confirmed = confirm(
  '请确认已经在微信或支付宝实际收到这笔订单的款项。确认后将标记为已付款。'
 );

 if(!confirmed) return;

 try{

  const client = getDB();

  const {data,error} = await client
   .from('orders')
   .update({
    payment_status:'已付款'
   })
   .eq('id',id)
   .eq('payment_status','待核实')
   .select('id');

  if(error) throw error;

  if(!data || data.length === 0){
   throw new Error('没有更新任何订单。订单可能已被处理，或数据库权限不允许此次操作。');
  }

  alert('收款状态已更新。');

  await loadOrders();

 }catch(error){

  alert('确认收款失败：'+error.message);

 }

}
